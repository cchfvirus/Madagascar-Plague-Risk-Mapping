<!DOCTYPE html>
<html>
<head>
    <title>Plague Risk Mapping - Interactive Layers</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .info { 
            padding: 10px 12px; 
            background: white; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            border-radius: 5px; 
            max-width: 300px;
        }
        
        .info h4 { margin: 0 0 5px; color: #333; }
        .info p { margin: 5px 0; font-size: 12px; color: #666; }
        
        .legend {
            line-height: 20px;
            color: #555;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 250px;
        }
        
        .legend h4 { margin: 0 0 8px; font-size: 14px; }
        
        .legend i {
            width: 20px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border: 1px solid #ccc;
        }
        
        .legend .item { 
            margin-bottom: 5px; 
            overflow: hidden; 
            font-size: 11px;
        }
        
        .legend .item.toggleable {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: opacity 0.2s;
        }
        
        .legend .item.toggleable:hover {
            background: #f0f0f0;
        }
        
        .legend .item.toggleable.hidden-class {
            opacity: 0.35;
            text-decoration: line-through;
        }
        
        .legend .item.toggleable input[type="checkbox"] {
            margin-right: 4px;
            vertical-align: middle;
            cursor: pointer;
        }
        
        .legend .gradient-bar {
            width: 100%;
            height: 20px;
            margin: 10px 0;
            border: 1px solid #ccc;
        }
        
        .legend .gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .legend .plague-cases-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .legend .plague-case-symbol {
            display: inline-block;
            font-size: 18px;
            color: #1e88e5;
            text-shadow: 1px 1px 2px #FFF, -1px -1px 2px #FFF, 1px -1px 2px #FFF, -1px 1px 2px #FFF;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .layer-control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
            max-width: 220px;
        }
        
        .layer-control h4 { 
            margin: 0 0 10px; 
            font-size: 14px;
        }
        
        .layer-control label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
            font-size: 13px;
        }
        
        .layer-control input[type="radio"] {
            margin-right: 8px;
        }
        
        .layer-control input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .layer-control .overlay-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .layer-control .overlay-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        
        .opacity-section h5 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .opacity-control {
            margin-bottom: 12px;
        }
        
        .opacity-control label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .opacity-control input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        .opacity-value {
            float: right;
            font-weight: bold;
            color: #333;
            font-size: 11px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 12px;
        }
        
        /* Popup styling */
        .leaflet-popup-content {
            margin: 10px;
            font-size: 12px;
        }
        
        .leaflet-popup-content h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #333;
        }
        
        .leaflet-popup-content table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leaflet-popup-content table td {
            padding: 3px 5px;
            border-bottom: 1px solid #eee;
        }
        
        .leaflet-popup-content table td:first-child {
            font-weight: bold;
            color: #666;
            width: 50%;
        }
        
        /* Coordinate copy notification */
        .copy-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .copy-notification.show {
            opacity: 1;
        }
        
        /* North Arrow */
        .north-arrow {
            position: absolute;
            bottom: 30px;
            left: 10px;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #c30b0b;
        }
        
        .north-arrow::before {
            content: "N";
        }
        
        .north-arrow::after {
            content: "";
            position: absolute;
            top: 8px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #c30b0b;
        }
        
        /* Export button */
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div>Loading map layers...</div>
        <div id="load-status" style="margin-top: 10px; font-size: 12px;"></div>
    </div>
    <div id="map"></div>
    <div class="north-arrow"></div>
    <div id="copy-notification" class="copy-notification"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <script>
        // Initialize map - centered on Antananarivo region (central Madagascar) with zoom 10
        var map = L.map('map').setView([-18.9, 47.52], 10);

        // Create custom panes with specific z-index ordering
        map.createPane('backgroundPane');
        map.getPane('backgroundPane').style.zIndex = 250;
        
        map.createPane('rasterPane');
        map.getPane('rasterPane').style.zIndex = 300;
        
        map.createPane('analysisPane');
        map.getPane('analysisPane').style.zIndex = 310;
        
        map.createPane('boundariesPane');
        map.getPane('boundariesPane').style.zIndex = 350;

        // Define basemaps
        var streetMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri',
            maxZoom: 19
        });

        var satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri',
            maxZoom: 19
        });

        // Add default basemap (Street Map)
        streetMap.addTo(map);

        // Store layers and georasters
        var layers = {};
        var georasters = {};
        var currentLayer = null;
        var activeLayers = {};
        var loadedCount = 0;
        var totalLayers = 4;
        var plagueCasesLayer = null;
        var highRiskBoundariesLayer = null;
        
        // Track hidden classes per layer (for toggleable legend items)
        var hiddenClasses = {
            'risk': {},
            'hotspot': {},
            'elevation': {}
        };

        // Layer configurations
        var layerConfigs = {
            'enm': {
                file: 'enm_cog.tif',
                name: 'Ecological Niche Model (1km)',
                colors: ['#d9d9d9', '#fed976', '#feb24c', '#fd8d3c', '#fc4e2a', '#e31a1c', '#b10026'],
                domain: [0, 1],
                labels: ['Low Suitability', 'High Suitability'],
                description: '',
                mode: 'lch',
                continuousLegend: true
            },
            'risk': {
                file: 'risk_zones_cog.tif',
                name: 'Risk Zones (100m)',
                discreteColors: {
                    0: '#000000',  // Black - No risk/background
                    1: '#FFFFBE',  // Light yellow - Very low risk
                    2: '#FFDD00',  // Yellow - Low risk
                    3: '#FFAA00',  // Orange - Moderate risk
                    4: '#FF6600',  // Red-orange - Elevated risk
                    6: '#FF0000',  // Red - High risk
                    9: '#A80000'   // Dark red - Very high risk
                },
                labels: ['No Risk', 'Very High Risk'],
                description: 'Plague Transmission Risk Zones',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 0, color: '#000000', label: '0 - No Risk' },
                    { value: 1, color: '#FFFFBE', label: '1 - Very Low Risk' },
                    { value: 2, color: '#FFDD00', label: '2 - Low Risk' },
                    { value: 3, color: '#FFAA00', label: '3 - Moderate Risk' },
                    { value: 4, color: '#FF6600', label: '4 - Elevated Risk' },
                    { value: 6, color: '#FF0000', label: '6 - High Risk' },
                    { value: 9, color: '#A80000', label: '9 - Very High Risk' }
                ]
            },
            'hotspot': {
                file: 'hotspot_cog.tif',
                name: 'Hot Spot Analysis (100m)',
                colors: ['#0571b0', '#92c5de', '#f7f7f7', '#f4a582', '#ca0020'],
                domain: [-3, 3],
                labels: ['Cold Spot', 'Not Significant', 'Hot Spot'],
                description: 'Getis-Ord Gi* statistic showing spatial clustering of plague risk',
                customLegend: true,
                discreteDisplay: true,
                legendItems: [
                    { value: 2.58, color: '#ca0020', label: 'Hot Spot with 99% Confidence' },
                    { value: 1.96, color: '#f4a582', label: 'Hot Spot with 95% Confidence' },
                    { value: 1.65, color: '#fddbc7', label: 'Hot Spot with 90% Confidence' },
                    { value: 0, color: '#f7f7f7', label: 'Not Significant' },
                    { value: -1.65, color: '#d1e5f0', label: 'Cold Spot with 90% Confidence' },
                    { value: -1.96, color: '#92c5de', label: 'Cold Spot with 95% Confidence' },
                    { value: -2.58, color: '#0571b0', label: 'Cold Spot with 99% Confidence' }
                ]
            },
            'elevation': {
                file: 'elevation.tif',
                name: 'Elevation (DEM)',
                domain: [0, 2747],
                labels: ['Low Elevation', 'High Elevation'],
                description: 'Digital Elevation Model (meters)',
                customLegend: true,
                discreteDisplay: false,
                elevationBreaks: [226.22, 560.17, 915.67, 1314.25, 2747],
                elevationColors: ['#FFFFFF', '#BFBFBF', '#808080', '#404040', '#000000'],
                legendItems: [
                    { value: 1, color: '#FFFFFF', label: '0 – 226 m' },
                    { value: 2, color: '#BFBFBF', label: '226 – 560 m' },
                    { value: 3, color: '#808080', label: '560 – 916 m' },
                    { value: 4, color: '#404040', label: '916 – 1,314 m' },
                    { value: 5, color: '#000000', label: '1,314 – 2,747 m' }
                ]
            }
        };

        // Add measurement tools
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            position: 'topright',
            draw: {
                polyline: {
                    shapeOptions: {
                        color: '#f357a1',
                        weight: 3
                    },
                    metric: true,
                    feet: false,
                    showLength: true
                },
                polygon: {
                    shapeOptions: {
                        color: '#f357a1',
                        weight: 3
                    },
                    showArea: true,
                    metric: true
                },
                rectangle: {
                    shapeOptions: {
                        color: '#4CAF50',
                        weight: 3,
                        fillOpacity: 0.1
                    }
                },
                circle: false,
                marker: false,
                circlemarker: false
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        // Handle drawn shapes
        map.on(L.Draw.Event.CREATED, function (event) {
            var layer = event.layer;
            var type = event.layerType;
            
            if (type === 'polyline') {
                var length = 0;
                var latlngs = layer.getLatLngs();
                for (var i = 0; i < latlngs.length - 1; i++) {
                    length += latlngs[i].distanceTo(latlngs[i + 1]);
                }
                var lengthKm = (length / 1000).toFixed(2);
                layer.bindPopup('<b>Distance:</b> ' + lengthKm + ' km');
                drawnItems.addLayer(layer);
            } else if (type === 'polygon') {
                var area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                var areaKm = (area / 1000000).toFixed(2);
                layer.bindPopup('<b>Area:</b> ' + areaKm + ' km²');
                drawnItems.addLayer(layer);
            } else if (type === 'rectangle') {
                // Rectangle for measurement
                var bounds = layer.getBounds();
                var area = (bounds.getNorth() - bounds.getSouth()) * 
                           (bounds.getEast() - bounds.getWest()) * 111 * 111; // Rough km²
                layer.bindPopup('<b>Rectangle Area:</b> ~' + area.toFixed(2) + ' km²');
                drawnItems.addLayer(layer);
            }
        });

        // Function to copy coordinates to clipboard
        function copyCoordinatesToClipboard(lat, lng) {
            var coordText = lat.toFixed(6) + ', ' + lng.toFixed(6);
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(coordText).then(function() {
                    showCopyNotification('Coordinates copied: ' + coordText);
                }).catch(function(err) {
                    fallbackCopyTextToClipboard(coordText);
                });
            } else {
                fallbackCopyTextToClipboard(coordText);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    showCopyNotification('Coordinates copied: ' + text);
                } else {
                    showCopyNotification('Failed to copy coordinates', true);
                }
            } catch (err) {
                showCopyNotification('Failed to copy coordinates', true);
            }
            
            document.body.removeChild(textArea);
        }

        function showCopyNotification(message, isError) {
            var notification = document.getElementById('copy-notification');
            notification.textContent = message;
            notification.style.background = isError ? 'rgba(198, 40, 40, 0.9)' : 'rgba(0, 0, 0, 0.8)';
            notification.classList.add('show');
            
            setTimeout(function() {
                notification.classList.remove('show');
            }, 2000);
        }

        function updateStatus(message, isError) {
            var statusDiv = document.getElementById('load-status');
            if (isError) {
                statusDiv.innerHTML += '<div class="error">' + message + '</div>';
            } else {
                statusDiv.innerHTML += '<div>' + message + '</div>';
            }
            console.log(message);
        }

        // Update layer opacity
        function updateLayerOpacity(layerId, opacity) {
            if (layers[layerId]) {
                layers[layerId].setOpacity(opacity);
            }
        }

        // Function to get raster value at a point
        function getRasterValueAtPoint(layerId, latlng) {
            if (!georasters[layerId]) {
                return null;
            }
            
            try {
                var georaster = georasters[layerId];
                var x = latlng.lng;
                var y = latlng.lat;
                
                // Get georaster bounds
                var xmin = georaster.xmin;
                var xmax = georaster.xmax;
                var ymin = georaster.ymin;
                var ymax = georaster.ymax;
                var width = georaster.width;
                var height = georaster.height;
                
                // Check if point is within bounds
                if (x < xmin || x > xmax || y < ymin || y > ymax) {
                    return null;
                }
                
                // Calculate pixel coordinates
                var pixelWidth = (xmax - xmin) / width;
                var pixelHeight = (ymax - ymin) / height;
                
                var pixelX = Math.floor((x - xmin) / pixelWidth);
                var pixelY = Math.floor((ymax - y) / pixelHeight);
                
                // Make sure we're within the raster bounds
                if (pixelX < 0 || pixelX >= width || pixelY < 0 || pixelY >= height) {
                    return null;
                }
                
                // Get the value from the raster - values[0] is a 2D array [row][col]
                var values = georaster.values;
                if (values && values[0] && values[0][pixelY]) {
                    var value = values[0][pixelY][pixelX];
                    
                    console.log('Layer:', layerId, 'Raw value:', value, 'Type:', typeof value, 'NoDataValue:', georaster.noDataValue);
                    
                    // Check for nodata value - including common noData values
                    if (value !== null && value !== undefined && !isNaN(value)) {
                        // Filter out common NoData values
                        if (value === 255 || value === -9999 || value === -3.4e38 || 
                            Math.abs(value) > 1e10 || value === -32768) {
                            console.log('Filtered as NoData:', value);
                            return null;
                        }
                        
                        // Check georaster's specified noDataValue
                        if (georaster.noDataValue !== null && georaster.noDataValue !== undefined && !isNaN(georaster.noDataValue)) {
                            if (Math.abs(value - georaster.noDataValue) < 0.0001) {
                                console.log('Value matches noDataValue:', georaster.noDataValue);
                                return null;
                            }
                        }
                        
                        return value;
                    }
                }
            } catch (error) {
                console.log('Error getting value for ' + layerId + ':', error);
            }
            
            return null;
        }

        // Toggle export mode
        // Load plague cases from GeoJSON
        function loadPlagueCases() {
            fetch('cases.geojson')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Plague cases file not found');
                    }
                    return response.json();
                })
                .then(data => {
                    updateStatus('Loaded ' + data.features.length + ' plague cases');
                    
                    plagueCasesLayer = L.geoJSON(data, {
                        pointToLayer: function(feature, latlng) {
                            return L.circleMarker(latlng, {
                                color: '#FFFFFF',
                                fillColor: '#0096FF',
                                fillOpacity: 1,
                                radius: 7,
                                weight: 1
                            });
                        },
                        onEachFeature: function(feature, layer) {
                            var popupContent = '<h3>Plague Case</h3><table>';
                            
                            for (var key in feature.properties) {
                                if (feature.properties.hasOwnProperty(key)) {
                                    var value = feature.properties[key];
                                    var displayKey = key.replace(/_/g, ' ').replace(/\b\w/g, function(l){ return l.toUpperCase() });
                                    popupContent += '<tr><td>' + displayKey + '</td><td>' + value + '</td></tr>';
                                }
                            }
                            
                            popupContent += '</table>';
                            
                            layer.bindPopup(popupContent, {
                                maxWidth: 300,
                                maxHeight: 400
                            });
                        }
                    });
                    
                    plagueCasesLayer.addTo(map);
                    
                    // Update legend to show plague cases
                    updateLegend();
                })
                .catch(error => {
                    console.log('Plague cases file not found - layer will not be available');
                    // Fail silently - no status message shown to user
                });
        }

        function togglePlagueCases(show) {
            if (plagueCasesLayer) {
                if (show) {
                    plagueCasesLayer.addTo(map);
                } else {
                    map.removeLayer(plagueCasesLayer);
                }
            }
        }

        function updateHighRiskBoundaryStyle() {
            if (highRiskBoundariesLayer) {
                // Black boundaries for ENM, Hotspot, and Elevation layers, white for Risk layer
                var boundaryColor = (currentLayer === 'risk') ? '#FFFFFF' : '#000000';
                
                highRiskBoundariesLayer.setStyle({
                    fillColor: 'transparent',
                    fillOpacity: 0,
                    color: boundaryColor,
                    weight: 2,
                    opacity: 1
                });
            }
        }

        function loadHighRiskBoundaries() {
            fetch('high_risk_boundaries.geojson')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('High risk boundaries file not found');
                    }
                    return response.json();
                })
                .then(data => {
                    updateStatus('Loaded high risk boundaries');
                    
                    // Initial color based on current layer (black for ENM, hotspot, elevation; white for risk)
                    var initialColor = (currentLayer === 'risk') ? '#FFFFFF' : '#000000';
                    
                    highRiskBoundariesLayer = L.geoJSON(data, {
                        style: {
                            fillColor: 'transparent',
                            fillOpacity: 0,
                            color: initialColor,
                            weight: 2,
                            opacity: 1
                        },
                        pane: 'boundariesPane',
                        onEachFeature: function(feature, layer) {
                            if (feature.properties && feature.properties['ADM1-EN']) {
                                layer.bindPopup('<h3>' + feature.properties['ADM1-EN'] + '</h3>', {
                                    maxWidth: 250
                                });
                            }
                        }
                    });
                    
                    highRiskBoundariesLayer.addTo(map);
                })
                .catch(error => {
                    console.log('High risk boundaries file not found - layer will not be available');
                    // Fail silently - no status message shown to user
                });
        }

        function toggleHighRiskBoundaries(show) {
            if (highRiskBoundariesLayer) {
                if (show) {
                    highRiskBoundariesLayer.addTo(map);
                } else {
                    map.removeLayer(highRiskBoundariesLayer);
                }
            }
        }

        function switchBasemap(basemapType) {
            map.removeLayer(streetMap);
            map.removeLayer(satelliteMap);
            
            if (basemapType === 'street') {
                streetMap.addTo(map);
            } else if (basemapType === 'satellite') {
                satelliteMap.addTo(map);
            }
        }

        function loadLayer(layerId) {
            var config = layerConfigs[layerId];
            
            updateStatus('Loading ' + config.name + '...');
            
            fetch(config.file)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('HTTP error! status: ' + response.status);
                    }
                    updateStatus(config.name + ' fetched successfully');
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    updateStatus('Parsing ' + config.name + '...');
                    return parseGeoraster(arrayBuffer);
                })
                .then(georaster => {
                    updateStatus(config.name + ' parsed successfully');
                    
                    // Store the georaster for value querying
                    georasters[layerId] = georaster;
                    
                    console.log('Loaded ' + layerId + ' - noDataValue:', georaster.noDataValue);
                    
                    // Set default opacity: All layers default to 0.6 (60%)
                    var layerOpacity = 0.6;
                    
                    // Create pixel value to color function based on layer type
                    var pixelValuesToColorFn;
                    
                    if (layerId === 'risk' && config.discreteColors) {
                        // For discrete risk layer - capture discreteColors in closure
                        var discreteColors = config.discreteColors;
                        pixelValuesToColorFn = function(values) {
                            var value = values[0];
                            if (value === null || value === undefined || isNaN(value)) {
                                return null;
                            }
                            
                            // Filter out 255 (noData value)
                            if (value === 255) {
                                return null;
                            }
                            
                            // Round to nearest integer
                            var intValue = Math.round(value);
                            
                            // Check if class is hidden
                            if (hiddenClasses['risk'] && hiddenClasses['risk'][intValue]) {
                                return null;
                            }
                            
                            // Look up color in discrete mapping
                            if (discreteColors.hasOwnProperty(intValue)) {
                                return discreteColors[intValue];
                            }
                            
                            // Return null for values not in our discrete set
                            return null;
                        };
                    } else if (layerId === 'elevation' && config.elevationBreaks) {
                        // For discrete elevation classes
                        var breaks = config.elevationBreaks;
                        var colors = config.elevationColors;
                        pixelValuesToColorFn = function(values) {
                            var value = values[0];
                            if (value === null || value === undefined || isNaN(value)) {
                                return null;
                            }
                            
                            // Filter common NoData values
                            if (value === 255 || value === -9999 || value === -32768 || 
                                value === -3.4e38 || Math.abs(value) > 1e10) {
                                return null;
                            }
                            
                            // Treat below 1 as transparent (ocean/background)
                            if (value < 1) {
                                return null;
                            }
                            
                            // Classify into elevation categories
                            for (var i = 0; i < breaks.length; i++) {
                                if (value <= breaks[i]) {
                                    return colors[i];
                                }
                            }
                            return colors[colors.length - 1];
                        };
                    } else {
                        // For continuous layers (ENM, Hotspot, Elevation)
                        var scale = config.mode 
                            ? chroma.scale(config.colors).mode(config.mode).domain(config.domain)
                            : chroma.scale(config.colors).domain(config.domain);
                        
                        // Capture noDataValue from georaster for use in color function
                        var noDataVal = georaster.noDataValue;
                        
                        pixelValuesToColorFn = function(values) {
                            var value = values[0];
                            if (value === null || value === undefined || isNaN(value)) {
                                return null;
                            }
                            
                            // Filter common NoData values
                            if (value === 255 || value === -9999 || value === -32768 || 
                                value === -3.4e38 || Math.abs(value) > 1e10) {
                                return null;
                            }
                            
                            // Check georaster's specified noDataValue
                            if (noDataVal !== null && noDataVal !== undefined && !isNaN(noDataVal)) {
                                if (Math.abs(value - noDataVal) < 0.0001) {
                                    return null;
                                }
                            }
                            
                            // For hotspot, check if class is hidden
                            if (layerId === 'hotspot' && hiddenClasses['hotspot']) {
                                var classValue = getHotspotClass(value);
                                if (hiddenClasses['hotspot'][classValue]) {
                                    return null;
                                }
                            }
                            
                            return scale(value).hex();
                        };
                    }
                    
                    var layerPane = (layerId === 'elevation') ? 'rasterPane' : 'analysisPane';
                    
                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: layerOpacity,
                        pixelValuesToColorFn: pixelValuesToColorFn,
                        resolution: 256,
                        pane: layerPane
                    });
                    
                    layers[layerId] = layer;
                    loadedCount++;
                    
                    updateStatus(config.name + ' ready! (' + loadedCount + '/' + totalLayers + ')');
                    
                    if (layerId === 'enm') {
                        // ENM is always the default analysis layer
                        // Remove any temporarily shown analysis layer
                        Object.keys(activeLayers).forEach(function(id) {
                            if (id !== 'elevation') {
                                map.removeLayer(layers[id]);
                                delete activeLayers[id];
                            }
                        });
                        layer.addTo(map);
                        activeLayers[layerId] = true;
                        currentLayer = 'enm';
                        updateLegend();
                        updateHighRiskBoundaryStyle();
                    } else if (layerId === 'elevation') {
                        // Don't auto-show elevation on load
                    } else if (!currentLayer) {
                        // Only show another layer if ENM hasn't loaded yet
                        layer.addTo(map);
                        activeLayers[layerId] = true;
                        currentLayer = layerId;
                        updateLegend();
                        updateHighRiskBoundaryStyle();
                    }
                    
                    if (loadedCount === totalLayers) {
                        setTimeout(function() {
                            document.getElementById('loading').style.display = 'none';
                        }, 1000);
                    }
                })
                .catch(error => {
                    var errorMsg = 'Error loading ' + config.name + ': ' + error.message;
                    updateStatus(errorMsg, true);
                    console.error(errorMsg, error);
                    
                    if (error.message.includes('Failed to fetch') || error.message.includes('CORS')) {
                        updateStatus('⚠️ CORS Error: You must serve files through a web server!', true);
                        updateStatus('Try using: R servr::httd() or Python http.server', true);
                    }
                });
        }

        function toggleLayer(layerId, show) {
            if (!layers[layerId]) return;
            
            if (show) {
                layers[layerId].addTo(map);
                activeLayers[layerId] = true;
            } else {
                map.removeLayer(layers[layerId]);
                delete activeLayers[layerId];
            }
            
            // Update currentLayer to the topmost active analysis layer (for click queries)
            var analysisLayers = ['enm', 'risk', 'hotspot'];
            currentLayer = null;
            for (var i = analysisLayers.length - 1; i >= 0; i--) {
                if (activeLayers[analysisLayers[i]]) {
                    currentLayer = analysisLayers[i];
                    break;
                }
            }
            // Fall back to elevation if no analysis layer is active
            if (!currentLayer && activeLayers['elevation']) {
                currentLayer = 'elevation';
            }
            
            updateLegend();
            updateHighRiskBoundaryStyle();
        }
        
        // Toggle individual class visibility within a discrete layer
        function toggleClass(layerId, classValue, show) {
            if (!hiddenClasses[layerId]) return;
            
            if (show) {
                delete hiddenClasses[layerId][classValue];
            } else {
                hiddenClasses[layerId][classValue] = true;
            }
            
            refreshLayer(layerId);
        }
        
        // Refresh a layer by removing and re-adding it to force redraw
        function refreshLayer(layerId) {
            if (!layers[layerId] || !activeLayers[layerId]) return;
            
            var config = layerConfigs[layerId];
            var georaster = georasters[layerId];
            if (!georaster) return;
            
            // Remove old layer
            map.removeLayer(layers[layerId]);
            
            var layerOpacity = 0.6;
            // Try to get current opacity from slider
            var opacitySlider = document.getElementById('opacity-' + layerId);
            if (opacitySlider) {
                layerOpacity = opacitySlider.value / 100;
            }
            
            var pixelValuesToColorFn;
            
            if (layerId === 'risk' && config.discreteColors) {
                var discreteColors = config.discreteColors;
                var hidden = hiddenClasses[layerId];
                pixelValuesToColorFn = function(values) {
                    var value = values[0];
                    if (value === null || value === undefined || isNaN(value)) return null;
                    if (value === 255) return null;
                    var intValue = Math.round(value);
                    if (hidden[intValue]) return null;
                    if (discreteColors.hasOwnProperty(intValue)) return discreteColors[intValue];
                    return null;
                };
            } else if (layerId === 'elevation' && config.elevationBreaks) {
                var breaks = config.elevationBreaks;
                var colors = config.elevationColors;
                var hidden = hiddenClasses[layerId];
                pixelValuesToColorFn = function(values) {
                    var value = values[0];
                    if (value === null || value === undefined || isNaN(value)) return null;
                    if (value === 255 || value === -9999 || value === -32768 || 
                        value === -3.4e38 || Math.abs(value) > 1e10) return null;
                    if (value < 1) return null;
                    for (var i = 0; i < breaks.length; i++) {
                        if (value <= breaks[i]) {
                            if (hidden[i + 1]) return null;
                            return colors[i];
                        }
                    }
                    if (hidden[colors.length]) return null;
                    return colors[colors.length - 1];
                };
            } else if (layerId === 'hotspot') {
                var scale = config.mode 
                    ? chroma.scale(config.colors).mode(config.mode).domain(config.domain)
                    : chroma.scale(config.colors).domain(config.domain);
                var noDataVal = georaster.noDataValue;
                var hidden = hiddenClasses[layerId];
                
                pixelValuesToColorFn = function(values) {
                    var value = values[0];
                    if (value === null || value === undefined || isNaN(value)) return null;
                    if (value === 255 || value === -9999 || value === -32768 || 
                        value === -3.4e38 || Math.abs(value) > 1e10) return null;
                    if (noDataVal !== null && noDataVal !== undefined && !isNaN(noDataVal)) {
                        if (Math.abs(value - noDataVal) < 0.0001) return null;
                    }
                    
                    // Check which hotspot class this value falls into and if it's hidden
                    var classValue = getHotspotClass(value);
                    if (hidden[classValue]) return null;
                    
                    return scale(value).hex();
                };
            }
            
            if (!pixelValuesToColorFn) return;
            
            var layerPane = (layerId === 'elevation') ? 'rasterPane' : 'analysisPane';
            
            var newLayer = new GeoRasterLayer({
                georaster: georaster,
                opacity: layerOpacity,
                pixelValuesToColorFn: pixelValuesToColorFn,
                resolution: 256,
                pane: layerPane
            });
            
            layers[layerId] = newLayer;
            newLayer.addTo(map);
        }
        
        // Determine which hotspot class a value belongs to
        function getHotspotClass(value) {
            if (value >= 2.58) return 2.58;
            if (value >= 1.96) return 1.96;
            if (value >= 1.65) return 1.65;
            if (value > -1.65) return 0;
            if (value > -1.96) return -1.65;
            if (value > -2.58) return -1.96;
            return -2.58;
        }

        function updateLegend() {
            var legendDiv = document.getElementById('legend-content');
            legendDiv.innerHTML = '';
            
            // Show legend for each active layer
            var activeKeys = Object.keys(activeLayers);
            if (activeKeys.length === 0) {
                legendDiv.innerHTML = '<h4>No layers active</h4>';
            }
            
            activeKeys.forEach(function(layerId, idx) {
                var config = layerConfigs[layerId];
                if (!config) return;
                
                // Add separator between layer legends
                if (idx > 0) {
                    legendDiv.innerHTML += '<div style="margin:10px 0; border-top:1px solid #ddd;"></div>';
                }
                
                legendDiv.innerHTML += '<h4>' + config.name + '</h4>';
                
                if (config.customLegend && config.legendItems) {
                    config.legendItems.forEach(function(item) {
                        var isHidden = hiddenClasses[layerId] && hiddenClasses[layerId][item.value];
                        var checkedAttr = isHidden ? '' : 'checked';
                        var hiddenClass = isHidden ? ' hidden-class' : '';
                        legendDiv.innerHTML +=
                            '<div class="item toggleable' + hiddenClass + '">' +
                            '<input type="checkbox" ' + checkedAttr + ' onchange="toggleClass(\'' + layerId + '\', ' + item.value + ', this.checked)">' +
                            '<i style="background:' + item.color + '"></i> ' +
                            item.label + '</div>';
                    });
                } else if (config.continuousLegend) {
                    var gradientStops = [];
                    for (var i = 0; i < config.colors.length; i++) {
                        var percentage = (i / (config.colors.length - 1)) * 100;
                        gradientStops.push(config.colors[i] + ' ' + percentage + '%');
                    }
                    var gradientCSS = 'linear-gradient(to right, ' + gradientStops.join(', ') + ')';
                    
                    legendDiv.innerHTML += 
                        '<div class="gradient-bar" style="background: ' + gradientCSS + ';"></div>' +
                        '<div class="gradient-labels">' +
                        '<span>' + config.labels[0] + '</span>' +
                        '<span>' + config.labels[1] + '</span>' +
                        '</div>';
                } else {
                    var numGrades = 5;
                    var range = config.domain[1] - config.domain[0];
                    var step = range / numGrades;
                    
                    var scale = config.mode 
                        ? chroma.scale(config.colors).mode(config.mode).domain(config.domain)
                        : chroma.scale(config.colors).domain(config.domain);
                    
                    for (var i = 0; i < numGrades; i++) {
                        var value = config.domain[0] + (step * i);
                        var nextValue = value + step;
                        var color = scale(value + step/2).hex();
                        
                        legendDiv.innerHTML +=
                            '<div class="item"><i style="background:' + color + '"></i> ' +
                            value.toFixed(2) + ' – ' + nextValue.toFixed(2) + '</div>';
                    }
                }
                
                if (config.description) {
                    legendDiv.innerHTML += '<p style="margin-top:10px; font-size:11px; color:#777;">' + 
                                           config.description + '</p>';
                }
            });
            
            // Add plague cases legend section if plague cases are loaded
            if (plagueCasesLayer) {
                legendDiv.innerHTML += 
                    '<div class="plague-cases-section">' +
                    '<div class="item">' +
                    '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#0096FF;border:1px solid #FFFFFF;margin-right:8px;vertical-align:middle;"></span>' +
                    '<span style="font-size:11px;">Plague Cases</span>' +
                    '</div>' +
                    '</div>';
            }
        }

        // Create layer control
        var layerControl = L.control({position: 'topleft'});
        layerControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'layer-control');
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            
            // Basemap section
            div.innerHTML = '<h4>Basemaps</h4>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="street" checked onchange="switchBasemap(\'street\')">Street Map</label>';
            div.innerHTML += '<label><input type="radio" name="basemap" value="satellite" onchange="switchBasemap(\'satellite\')">Satellite Imagery</label>';
            
            // Risk layers section
            div.innerHTML += '<h4 style="margin-top:15px; padding-top:10px; border-top: 1px solid #ddd;">Risk Layers</h4>';
            
            Object.keys(layerConfigs).forEach(function(key) {
                var checked = (key === 'enm') ? 'checked' : '';
                div.innerHTML += 
                    '<label><input type="checkbox" name="layer" value="' + key + '" ' + checked + 
                    ' onchange="toggleLayer(\'' + key + '\', this.checked)">' + 
                    layerConfigs[key].name + '</label>';
            });
            
            // Overlay section
            div.innerHTML += '<div class="overlay-section">';
            div.innerHTML += '<h5>Overlays</h5>';
            div.innerHTML += '<label><input type="checkbox" id="plague-cases-toggle" checked onchange="togglePlagueCases(this.checked)">Plague Cases</label>';
            div.innerHTML += '<label><input type="checkbox" id="high-risk-toggle" checked onchange="toggleHighRiskBoundaries(this.checked)">High-Risk Regions</label>';
            div.innerHTML += '</div>';
            
            // Opacity sliders section - All layers default to 60%
            div.innerHTML += '<div class="opacity-section">';
            div.innerHTML += '<h5>Layer Opacity</h5>';
            
            Object.keys(layerConfigs).forEach(function(key) {
                var defaultOpacity = 0.6;
                div.innerHTML += 
                    '<div class="opacity-control">' +
                    '<label>' + layerConfigs[key].name + ' <span class="opacity-value" id="opacity-value-' + key + '">' + Math.round(defaultOpacity * 100) + '%</span></label>' +
                    '<input type="range" id="opacity-' + key + '" min="0" max="100" value="' + (defaultOpacity * 100) + '" ' +
                    'oninput="updateLayerOpacity(\'' + key + '\', this.value/100); document.getElementById(\'opacity-value-' + key + '\').textContent = this.value + \'%\'">' +
                    '</div>';
            });
            
            div.innerHTML += '</div>';
            
            return div;
        };
        layerControl.addTo(map);

        // Create legend
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.id = 'legend-content';
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        legend.addTo(map);

        // Info box removed

        // Add right-click handler to copy coordinates
        map.on('contextmenu', function(e) {
            copyCoordinatesToClipboard(e.latlng.lat, e.latlng.lng);
        });

        // Add left-click handler to show cell value from CURRENT layer only
        map.on('click', function(e) {
            // Check if current layer is loaded
            if (!currentLayer || !georasters[currentLayer]) {
                return;
            }
            
            // Get value from the currently visible layer only
            var value = getRasterValueAtPoint(currentLayer, e.latlng);
            var config = layerConfigs[currentLayer];
            
            // Format display value based on layer type
            var displayValue;
            if (value !== null) {
                if (config.discreteDisplay) {
                    // For discrete layers (risk, hotspot), show integer
                    displayValue = Math.round(value).toString();
                } else {
                    // For continuous layers (ENM, Elevation), show 4 decimal places
                    displayValue = value.toFixed(4);
                }
            } else {
                displayValue = 'No Data';
            }
            
            // Add unit suffix for elevation
            var unitSuffix = '';
            if (currentLayer === 'elevation' && value !== null) {
                unitSuffix = ' m';
            }
            
            var popupContent = '<h3>' + config.name + '</h3><table>';
            popupContent += '<tr><td>Coordinates</td><td>' + e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6) + '</td></tr>';
            popupContent += '<tr><td>Cell Value</td><td>' + displayValue + unitSuffix + '</td></tr>';
            popupContent += '</table>';
            
            L.popup()
                .setLatLng(e.latlng)
                .setContent(popupContent)
                .openOn(map);
        });

        // Load all layers
        updateStatus('Starting to load layers...');
        Object.keys(layerConfigs).forEach(function(key) {
            loadLayer(key);
        });
        
        loadPlagueCases();
        loadHighRiskBoundaries();
    </script>
</body>
</html>
